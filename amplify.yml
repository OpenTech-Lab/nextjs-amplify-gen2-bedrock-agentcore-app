version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 22
        - npm install -g pnpm@10
        - pnpm config set store-dir .pnpm-store
        - pnpm install --prefer-offline --child-concurrency 1
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install -g pnpm@10
        - pnpm config set store-dir .pnpm-store
        - pnpm install --prefer-offline --child-concurrency 1
    build:
      commands:
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .pnpm-store/**/*
