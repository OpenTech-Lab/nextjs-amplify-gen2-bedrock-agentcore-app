requires-python = ">=3.12"
dependencies = [
    "bedrock-agentcore",
    "strands-agents",
    "strands-agents-tools",
    "mcp",
    "fastmcp",
    "awslabs.aws-documentation-mcp-server",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
